<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单文件动画模板</title>
  <style>
    :root{color-scheme:dark;--bg:#10110f;--ink:#f2f0e8;--muted:#a7aa9f;--accent:#ff6b35;--line:#34362f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body{min-height:100svh;display:grid;grid-template-rows:1fr auto;overflow-x:hidden}
    .stage{position:relative;isolation:isolate;display:grid;align-content:center;min-height:78svh;padding:clamp(28px,6vw,88px);overflow:hidden}
    .grid{position:absolute;inset:0;z-index:-2;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:72px 72px;opacity:.18;mask-image:linear-gradient(to bottom,black,transparent 90%)}
    .halo{position:absolute;z-index:-1;width:min(62vw,720px);aspect-ratio:1;right:-12vw;top:-24%;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,.22),rgba(255,107,53,0) 68%)}
    .eyebrow{display:flex;align-items:center;gap:12px;margin:0 0 28px;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    .eyebrow:before{content:"";width:32px;height:2px;background:currentColor}
    h1{max-width:980px;margin:0;font-size:clamp(48px,9vw,132px);line-height:.94;letter-spacing:-.065em;font-weight:760}
    .line{display:block;overflow:hidden;padding-bottom:.08em}.line>span{display:block}.accent{color:var(--accent)}
    .summary{max-width:540px;margin:32px 0 0;color:var(--muted);font-size:clamp(16px,1.8vw,21px);line-height:1.7}
    .orbit{position:absolute;right:8vw;bottom:9%;width:clamp(120px,18vw,250px);aspect-ratio:1;border:1px solid rgba(242,240,232,.25);border-radius:50%;pointer-events:none}
    .orbit:after{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 24px var(--accent)}
    .stamp{position:absolute;right:clamp(28px,6vw,88px);top:clamp(28px,6vw,70px);display:grid;place-items:center;width:74px;aspect-ratio:1;border:1px solid var(--line);border-radius:50%;color:var(--muted);font-size:11px;letter-spacing:.1em}
    .controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px clamp(20px,4vw,48px);border-top:1px solid var(--line);background:rgba(16,17,15,.94)}
    button{min-width:88px;min-height:42px;border:1px solid var(--line);border-radius:999px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}.time{min-width:88px;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right}
    @media(max-width:640px){.stage{min-height:76svh}.stamp{display:none}.orbit{right:-24px;bottom:5%;opacity:.6}.controls{grid-template-columns:auto 1fr}.time{display:none}h1{letter-spacing:-.05em}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="stage" aria-label="动画：让想法开始流动">
    <div class="grid" aria-hidden="true"></div><div class="halo" aria-hidden="true"></div>
    <div class="stamp" aria-hidden="true">HTML / 01</div>
    <p class="eyebrow">Single file motion</p>
    <h1><span class="line"><span>让想法</span></span><span class="line"><span class="accent">开始流动。</span></span></h1>
    <p class="summary">一个 HTML，一条时间轴。无需安装、无需联网，用节奏和构图把重点讲清楚。</p>
    <div class="orbit" aria-hidden="true"></div>
  </main>
  <footer class="controls" aria-label="动画控制">
    <button id="toggle" type="button" aria-label="暂停动画">暂停</button>
    <input id="timeline" type="range" min="0" max="8" step="0.01" value="0" aria-label="动画时间轴">
    <output id="time" class="time" for="timeline">0.00 / 8.00</output>
  </footer>
  <script>
    (() => {
      const DURATION = 8;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)');
      const effects = [
        ['.grid',[{opacity:0},{opacity:.18}],{duration:1200,easing:'ease-out'}],
        ['.halo',[{opacity:0,transform:'scale(.65)'},{opacity:1,transform:'scale(1)'}],{duration:2200,easing:'cubic-bezier(.2,.8,.2,1)'}],
        ['.eyebrow',[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0)'}],{delay:250,duration:650,easing:'cubic-bezier(.2,.8,.2,1)'}],
        ['.line:nth-child(1)>span',[{opacity:0,transform:'translateY(110%)'},{opacity:1,transform:'translateY(0)'}],{delay:450,duration:900,easing:'cubic-bezier(.16,1,.3,1)'}],
        ['.line:nth-child(2)>span',[{opacity:0,transform:'translateY(110%)'},{opacity:1,transform:'translateY(0)'}],{delay:650,duration:950,easing:'cubic-bezier(.16,1,.3,1)'}],
        ['.summary',[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'translateY(0)'}],{delay:1200,duration:800,easing:'cubic-bezier(.2,.8,.2,1)'}],
        ['.stamp',[{opacity:0,transform:'rotate(-45deg) scale(.7)'},{opacity:1,transform:'rotate(0) scale(1)'}],{delay:1500,duration:900,easing:'cubic-bezier(.16,1,.3,1)'}],
        ['.orbit',[{opacity:0,transform:'rotate(-70deg) scale(.8)'},{opacity:1,transform:'rotate(110deg) scale(1)'}],{delay:500,duration:7500,easing:'cubic-bezier(.3,.6,.2,1)'}]
      ];
      const animations = effects.map(([selector,keyframes,options]) => {
        const animation = document.querySelector(selector).animate(keyframes,{...options,fill:'both'});
        animation.pause();
        return animation;
      });
      const button = document.querySelector('#toggle');
      const slider = document.querySelector('#timeline');
      const output = document.querySelector('#time');
      let raf = 0, playing = false, startStamp = 0, startValue = 0;
      const current = () => Math.max(0,Math.min(DURATION,(animations[0].currentTime || 0)/1000));
      function paintTime(){const t=current();slider.value=t;output.value=`${t.toFixed(2)} / ${DURATION.toFixed(2)}`}
      function render(seconds){const t=Math.max(0,Math.min(DURATION,Number(seconds)||0));animations.forEach(a=>{a.currentTime=t*1000});paintTime()}
      function label(){button.textContent=playing?'暂停':current()>=DURATION?'重播':'播放';button.setAttribute('aria-label',button.textContent+'动画')}
      function sync(){if(!playing)return;const t=startValue+(performance.now()-startStamp)/1000;render(t);if(t>=DURATION){playing=false;render(DURATION);label();return}raf=requestAnimationFrame(sync)}
      function play(){if(current()>=DURATION)render(0);startValue=current();startStamp=performance.now();playing=true;cancelAnimationFrame(raf);label();sync()}
      function pause(){playing=false;cancelAnimationFrame(raf);paintTime();label()}
      function seek(seconds){playing=false;cancelAnimationFrame(raf);render(seconds);label()}
      button.addEventListener('click',()=>playing?pause():play());
      slider.addEventListener('input',event=>seek(event.target.value));
      reduce.addEventListener('change',event=>{if(event.matches)seek(DURATION)});
      window.motion={play,pause,seek};
      const frozen=new URLSearchParams(location.search).get('t');
      if(reduce.matches||frozen!==null)seek(frozen===null?DURATION:parseFloat(frozen));else play();
    })();
  </script>
</body>
</html>
